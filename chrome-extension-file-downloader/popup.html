<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 12px 0;
      color: #333;
    }
    .status {
      background: #f5f5f5;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 12px;
      min-height: 60px;
    }
    .status-label {
      font-weight: 600;
      color: #666;
      margin-bottom: 4px;
    }
    .status-text {
      color: #333;
      word-break: break-word;
    }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 4px;
      margin-top: 8px;
      overflow: hidden;
      display: none;
    }
    .progress-bar.active {
      display: block;
    }
    .progress-fill {
      height: 100%;
      background: #4CAF50;
      border-radius: 4px;
      transition: width 0.3s ease;
      width: 0%;
    }
    .stats {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
      font-size: 12px;
      color: #666;
    }
    .stat {
      background: #f0f0f0;
      padding: 6px 10px;
      border-radius: 4px;
    }
    .stat-value {
      font-weight: 600;
      color: #333;
    }
    button {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    #startBtn {
      background: #4CAF50;
      color: white;
    }
    #startBtn:hover:not(:disabled) {
      background: #43a047;
    }
    #startBtn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    #stopBtn {
      background: #f44336;
      color: white;
      margin-top: 8px;
      display: none;
    }
    #stopBtn:hover {
      background: #d32f2f;
    }
    #stopBtn.active {
      display: block;
    }
    .error {
      color: #f44336;
    }
  </style>
</head>
<body>
  <h1>📄 Document Downloader</h1>
  
  <div class="stats">
    <div class="stat">Files: <span class="stat-value" id="fileCount">0</span>/500</div>
    <div class="stat">Pages: <span class="stat-value" id="pageCount">0</span></div>
  </div>
  
  <div class="status">
    <div class="status-label">Status</div>
    <div class="status-text" id="statusText">Ready to scan</div>
    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>
  
  <button id="startBtn">Start Download</button>
  <button id="stopBtn">Stop</button>
  
  <script src="popup.js"></script>
</body>
</html>
