<!DOCTYPE html>
<html>
<head>
  <title>Deep Downloader</title>
  <style>
    body { width: 300px; padding: 10px; font-family: sans-serif; }
    button { width: 100%; padding: 10px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px; }
    button:disabled { background-color: #ccc; }
    #status { margin-top: 10px; font-size: 12px; }
    .stats { margin-top: 10px; font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <h3>Deep File Downloader</h3>
  <p>Downloads files from current page + 1 level deep.</p>
  <button id="startBtn">Start Download</button>
  <div id="status"></div>
  <div class="stats" id="stats"></div>
  <script src="popup.js"></script>
</body>
</html>
