<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Linked File Downloader</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0b0d12;
        --fg: #e7e9ee;
        --muted: #a8afc0;
        --border: rgba(255, 255, 255, 0.12);
        --btn: #2f6fed;
        --btnfg: white;
      }
      body {
        margin: 0;
        padding: 12px;
        width: 360px;
        font: 13px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Arial,
          sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px 0;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      button {
        appearance: none;
        border: 1px solid var(--border);
        background: var(--btn);
        color: var(--btnfg);
        padding: 8px 10px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
      }
      button[disabled] {
        opacity: 0.6;
        cursor: default;
      }
      a {
        color: var(--fg);
      }
      .muted {
        color: var(--muted);
        font-size: 12px;
      }
      #log {
        margin-top: 10px;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px;
        height: 240px;
        overflow: auto;
        background: rgba(255, 255, 255, 0.04);
        white-space: pre-wrap;
      }
      .line {
        margin: 0 0 6px 0;
      }
      .warn {
        color: #f7c948;
      }
      .error {
        color: #ff6b6b;
      }
      .ok {
        color: #51cf66;
      }
    </style>
  </head>
  <body>
    <h1>Download linked files (1-level deep)</h1>
    <div class="row">
      <button id="start">Start</button>
      <a id="options" class="muted" href="#">Options</a>
    </div>
    <div class="muted" style="margin-top: 8px">
      Downloads go to <code>Downloads/linked-downloads/...</code>
    </div>
    <div id="log" aria-live="polite"></div>
    <script src="popup.js"></script>
  </body>
</html>
